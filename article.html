<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>K4N | Article</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:Arial,sans-serif}header{background:#000;color:#fff;text-align:center;padding:24px}.logo{font:bold 34px Georgia,serif}header p{font-size:10px;letter-spacing:3px}main{max-width:850px;margin:35px auto;padding:0 20px}.back{color:#111;font-weight:bold;text-decoration:none;font-size:13px}.article{background:#fff;padding:30px;margin-top:20px}.meta{font-size:12px;color:#777;letter-spacing:1px}.article h1{font:bold 38px Georgia,serif;line-height:1.2}.excerpt{font-size:19px;color:#555;line-height:1.5}.hero{width:100%;max-height:440px;object-fit:cover}.body{font-size:17px;line-height:1.8}.body img{max-width:100%;height:auto}.body h2,.body h3{font-family:Georgia,serif}footer{text-align:center;background:#000;color:#fff;padding:25px;margin-top:45px}@media(max-width:600px){.article{padding:20px}.article h1{font-size:29px}}
</style></head><body><header><div class="logo">KaMoRaLe 4 Network</div><p>ONE NATION WITH ONE CONNECTION</p></header><main><a class="back" href="index.html">← BACK TO K4N</a><article id="story" class="article">Loading story…</article></main><footer>K4N • One Nation with One Connection</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="config.js"></script><script>
(async()=>{const el=document.getElementById("story"),id=new URLSearchParams(location.search).get("id"),c=window.K4N_CONFIG||{};if(!id){el.textContent="No article was selected.";return;}if(!c.SUPABASE_URL||c.SUPABASE_URL.includes("PASTE_")){el.textContent="K4N is being configured.";return;}const sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const {data,error}=await sb.from("articles").select("*").eq("id",id).eq("status","published").single();if(error||!data){el.textContent="This story could not be found.";return;}const clean=s=>DOMPurify.sanitize(s||"",{USE_PROFILES:{html:true}});document.title=data.title+" | K4N";el.innerHTML=`<div class="meta">${clean(data.category).toUpperCase()} · ${data.published_at?new Date(data.published_at).toLocaleDateString():""} · ${clean(data.author)}</div><h1>${clean(data.title)}</h1><p class="excerpt">${clean(data.excerpt)}</p>${data.image_url?`<img class="hero" src="${clean(data.image_url)}" alt="">`:""}<div class="body">${clean(data.content_html)}</div>`;})();
</script></body></html>
