<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaMoRaLe 4 Network | K4N</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:Arial,sans-serif}header{background:#000;color:#fff;text-align:center;padding:25px 15px}.logo{font:bold 38px Georgia,serif;letter-spacing:2px}.tagline{font-size:11px;letter-spacing:4px;margin-top:8px}nav{background:#fff;text-align:center;padding:15px;border-bottom:2px solid #111;position:sticky;top:0;z-index:5}nav a{color:#111;text-decoration:none;font-size:13px;font-weight:bold;margin:0 12px}.breaking{background:#111;color:#fff;padding:12px max(calc((100% - 1150px)/2),20px);font-size:13px}.container{max-width:1150px;margin:30px auto;padding:0 20px}.section-title{font:bold 25px Georgia,serif;border-bottom:2px solid #111;padding-bottom:10px;margin:0 0 20px}.featured{background:#222;color:#fff;padding:35px 28px;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end}.featured img{max-height:320px;object-fit:cover;width:100%;margin-bottom:18px}.featured h1{font:bold 35px Georgia,serif;margin:8px 0}.featured p{line-height:1.6;color:#ddd}.category{font-size:11px;letter-spacing:1px;font-weight:bold;color:#666}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #ddd;padding:17px}.card img{width:100%;height:175px;object-fit:cover;background:#ddd}.card h3{font:bold 20px Georgia,serif;margin:9px 0}.card p{font-size:14px;line-height:1.6;color:#555}.card a{color:#111;font-weight:bold;text-decoration:none;font-size:13px}.states{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.state{background:#111;color:#fff;text-align:center;padding:20px 8px;font:20px Georgia,serif;text-decoration:none}.state-stories{margin-top:30px}.state-group{margin:28px 0}.state-group h3{font:bold 21px Georgia,serif;border-bottom:1px solid #bbb;padding-bottom:8px}.state-group .grid{grid-template-columns:repeat(3,1fr)}section{margin-top:38px}footer{background:#000;color:#fff;text-align:center;padding:35px 15px;margin-top:50px;line-height:1.8}footer p{color:#ccc}.empty{background:#fff;padding:25px;color:#666}.featured a{color:#fff;font-weight:bold}.featured a,.card a{text-decoration:none}.featured a:hover,.card a:hover{text-decoration:underline}@media(max-width:700px){.grid,.state-group .grid{grid-template-columns:1fr}.states{grid-template-columns:repeat(2,1fr)}nav a{display:inline-block;margin:7px}.logo{font-size:27px}.featured h1{font-size:27px}}
</style>
</head>
<body>
<header id="site-header"><div class="logo" id="site-logo">KaMoRaLe 4 Network</div><div class="tagline" id="site-tagline">ONE NATION WITH ONE CONNECTION</div></header>
<nav id="site-nav"><a href="#home">HOME</a><a href="#latest">LATEST NEWS</a><a href="#states">FSM STATES</a><a href="#national">NATIONAL &amp; PACIFIC</a><a href="#about">ABOUT</a><a href="#contact">CONTACT</a></nav>
<div class="breaking" id="breaking">K4N NEWS: Connecting Micronesia, One Story at a Time.</div>
<main class="container" id="home"><div id="dynamic-sections"></div></main>
<footer id="site-footer"><h2 id="footer-name">KaMoRaLe 4 Network</h2><p id="footer-tagline">One Nation with One Connection.</p><small>© <span id="year"></span> K4N. All Rights Reserved.</small></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="config.js"></script>
<script>
document.getElementById("year").textContent=new Date().getFullYear();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]));
const safeImageUrl=value=>{try{const u=new URL(String(value||""),location.href);return ["http:","https:"].includes(u.protocol)?u.href:"";}catch{return "";}};
const defaultSettings={siteName:"KaMoRaLe 4 Network",tagline:"ONE NATION WITH ONE CONNECTION",breakingText:"K4N NEWS: Connecting Micronesia, One Story at a Time.",headerColor:"#000000",backgroundColor:"#f5f5f5",textColor:"#111111",sections:[{id:"hero",type:"hero",title:"Top Story",heading:"Welcome to KaMoRaLe 4 Network",body:"Your connection to news, stories, events and developments across Micronesia and the Pacific.",enabled:true},{id:"latest",type:"latest",title:"Latest News",heading:"Latest News",enabled:true},{id:"states",type:"states",title:"Explore the Four States",heading:"Explore the Four States",enabled:true},{id:"national",type:"text",title:"National & Pacific News",heading:"National & Pacific News",body:"Important developments from the FSM, the Pacific region and around the world.",enabled:true},{id:"about",type:"text",title:"About K4N",heading:"About K4N",body:"KaMoRaLe 4 Network (K4N) is an independent media platform dedicated to connecting communities through news, information, culture and stories from Micronesia and beyond.\n\nOne Nation with One Connection.",enabled:true},{id:"contact",type:"contact",title:"Contact Us",heading:"Contact Us",body:"Have a story, announcement or community update? Contact the K4N editorial team.",email:"",enabled:true}]};
function renderSection(s){const id=esc(s.id||("section-"+Math.random().toString(36).slice(2)));const heading=esc(s.heading||s.title||"");const body=esc(s.body||"").replace(/\n/g,"<br>");if(s.id==="hero"||s.type==="hero")return `<section id="hero" style="margin-top:0"><h2 class="section-title">${esc(s.title||"Top Story")}</h2><div id="featured" class="featured"><span class="category" style="color:#aaa">FEATURED NEWS</span><h1>${heading||"Welcome to KaMoRaLe 4 Network"}</h1><p>${body||"Your connection to news, stories, events and developments across Micronesia and the Pacific."}</p></div></section>`;if(s.type==="latest")return `<section id="latest"><h2 class="section-title">${heading||"Latest News"}</h2><div id="news-grid" class="grid"><div class="empty">Loading latest K4N stories…</div></div></section>`;if(s.type==="states")return `<section id="states"><h2 class="section-title">${heading||"Explore the Four States"}</h2><div class="states"><a class="state" href="#state-yap">YAP</a><a class="state" href="#state-chuuk">CHUUK</a><a class="state" href="#state-pohnpei">POHNPEI</a><a class="state" href="#state-kosrae">KOSRAE</a></div><div id="state-articles" class="state-stories"><p class="empty">Loading state stories…</p></div></section>`;if(s.type==="image"){const image=safeImageUrl(s.imageUrl);return `<section id="${id}"><h2 class="section-title">${heading}</h2>${image?`<img src="${esc(image)}" alt="" style="width:100%;max-height:360px;object-fit:cover">`:""}<p>${body}</p></section>`;}if(s.type==="contact")return `<section id="contact"><h2 class="section-title">${heading||"Contact Us"}</h2><p>${body}</p>${s.email?`<a href="mailto:${esc(s.email)}">Email K4N</a>`:""}</section>`;if(s.type==="announcement")return `<section id="${id}"><div style="background:#111;color:#fff;padding:22px"><h2 style="margin-top:0">${heading}</h2><p>${body}</p></div></section>`;return `<section id="${id}"><h2 class="section-title">${heading}</h2><p>${body}</p></section>`;}
async function loadSiteSettings(sb){const {data,error}=await sb.from("site_settings").select("settings").eq("id","main").maybeSingle();if(error){console.warn("K4N site settings unavailable; showing built-in defaults.",error.message);return;}const s={...defaultSettings,...(data?.settings||{})};document.title=(s.siteName||defaultSettings.siteName)+" | K4N";document.getElementById("site-logo").textContent=s.siteName||defaultSettings.siteName;document.getElementById("site-tagline").textContent=s.tagline||"";document.getElementById("breaking").textContent=s.breakingText||"";document.getElementById("site-header").style.background=s.headerColor||"#000";document.body.style.background=s.backgroundColor||"#f5f5f5";document.body.style.color=s.textColor||"#111";const sections=Array.isArray(s.sections)?s.sections.filter(x=>x.enabled!==false):defaultSettings.sections;document.getElementById("dynamic-sections").innerHTML=sections.map(renderSection).join("");document.getElementById("footer-name").textContent=s.siteName||defaultSettings.siteName;document.getElementById("footer-tagline").textContent=(s.tagline||"")+".";}
function renderStateArticles(articles){const host=document.getElementById("state-articles");if(!host)return;const states=[{name:"Yap",key:"yap"},{name:"Chuuk",key:"chuuk"},{name:"Pohnpei",key:"pohnpei"},{name:"Kosrae",key:"kosrae"}];host.innerHTML=states.map(state=>{const stories=articles.filter(a=>String(a.category||"").trim().toLowerCase()===state.key);const cards=stories.map(a=>{const image=safeImageUrl(a.image_url);const href="article.html?id="+encodeURIComponent(a.id);return `<article class="card">${image?`<a href="${href}"><img src="${esc(image)}" alt="${esc(a.title)}"></a>`:""}<span class="category">${esc(a.category).toUpperCase()} · ${esc(a.published_at?new Date(a.published_at).toLocaleDateString():"")}</span><h3><a href="${href}">${esc(a.title)}</a></h3>${a.excerpt?`<p>${esc(a.excerpt)}</p>`:""}<a href="${href}">READ MORE →</a></article>`;}).join("");return `<div class="state-group" id="state-${state.key}"><h3>${state.name}</h3>${cards?`<div class="grid">${cards}</div>`:`<p class="empty">No published ${state.name} stories yet.</p>`}</div>`;}).join("");}
(async()=>{const c=window.K4N_CONFIG||{};if(!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY){document.getElementById("dynamic-sections").innerHTML='<div class="empty">K4N newsroom is being configured. Please check back soon.</div>';return;}const sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);await loadSiteSettings(sb);const {data,error}=await sb.from("articles").select("id,title,excerpt,category,author,image_url,content_html,featured,published_at,created_at").eq("status","published").order("published_at",{ascending:false}).limit(100);if(error){const grid=document.getElementById("news-grid");if(grid)grid.innerHTML='<div class="empty">K4N news is temporarily unavailable.</div>';const states=document.getElementById("state-articles");if(states)states.innerHTML='<div class="empty">State stories are temporarily unavailable.</div>';console.error("K4N Supabase error:",error);return;}const stories=data||[];const date=s=>s?new Date(s).toLocaleDateString():"";const link=a=>"article.html?id="+encodeURIComponent(a.id);const featured=stories.find(a=>a.featured);const featuredHost=document.getElementById("featured");if(featuredHost&&featured){const image=safeImageUrl(featured.image_url);featuredHost.innerHTML=`${image?`<img src="${esc(image)}" alt="${esc(featured.title)}">`:""}<span class="category" style="color:#bbb">${esc(featured.category).toUpperCase()} · FEATURED</span><h1>${esc(featured.title)}</h1><p>${esc(featured.excerpt||"")}</p><a href="${link(featured)}">Read full story →</a>`;}const grid=document.getElementById("news-grid");if(grid){const latest=stories.filter(a=>!featured||a.id!==featured.id);grid.innerHTML=latest.length?latest.slice(0,12).map(a=>{const image=safeImageUrl(a.image_url);return `<article class="card">${image?`<a href="${link(a)}"><img src="${esc(image)}" alt="${esc(a.title)}"></a>`:""}<span class="category">${esc(a.category).toUpperCase()} · ${date(a.published_at||a.created_at)}</span><h3><a href="${link(a)}">${esc(a.title)}</a></h3><p>${esc(a.excerpt||"")}</p><a href="${link(a)}">READ MORE →</a></article>`;}).join(""):'<div class="empty">No stories have been published yet. Please check back soon.</div>'; }renderStateArticles(stories);})();
</script>
</body>
</html>
